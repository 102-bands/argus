[project]
name = "argus-api"
version = "0.1.0"
description = "Argus backend: SPHEREx blink pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "numpy>=2.1",
  "astropy>=7.0",
  "reproject>=0.14",
  "httpx>=0.28",
  "fsspec>=2024.10",
  "s3fs>=2024.10",
  "brotli>=1.1",
  "slowapi>=0.1.9",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live IRSA / S3 / Gaia (deselect with -m 'not network')"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not network'"
pythonpath = ["."]
